name: Upgrade dependencies

run-name: Upgrade Go dependencies

# Weekly Go module and toolchain upgrade for this public repository.
# Cannot call weprodev/shared-workflows (private) from a public caller.
#
# Needs vars.SLACK_ALERTS_CHANNEL_ID and secrets.SLACK_BOT_TOKEN.
#
# CI uses setup-go go-version-file: go.mod and installs the latest stable
# golangci-lint, so a go.mod toolchain bump stays aligned without a separate
# GO_VERSION pin. GITHUB_TOKEN still cannot rewrite workflow files; if CI is
# still on a hardcoded pin, go-pr blocks the PR and Slack gets the fix steps.
#
# go-test mirrors CI: gofmt, latest golangci-lint, build, race tests (+ Postgres).
# go-pr also refreshes non-workflow Go pins (.go-version, Dockerfiles, etc.).

on:
  schedule:
    # Saturday 06:00 UTC.
    - cron: "0 6 * * 6"
  workflow_dispatch:
    inputs:
      target_go_version:
        description: "Go version to pin (for example 1.27.4). Leave empty for the latest stable release."
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: upgrade-dependencies
  cancel-in-progress: false

env:
  BOT_IDENTITY: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

jobs:
  validate-configuration:
    name: Validate automation configuration
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    env:
      SLACK_CHANNEL_ID: ${{ vars.SLACK_ALERTS_CHANNEL_ID }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      TARGET_GO: ${{ github.event_name == 'workflow_dispatch' && inputs.target_go_version || '' }}
    steps:
      - name: Check required settings
        run: |
          set -euo pipefail
          [ -n "$SLACK_CHANNEL_ID" ] || { echo "::error::SLACK_ALERTS_CHANNEL_ID is not configured"; exit 1; }
          [[ "$SLACK_CHANNEL_ID" =~ ^[CGD][A-Z0-9]{6,}$ ]] || { echo "::error::SLACK_ALERTS_CHANNEL_ID is not a Slack channel ID"; exit 1; }
          [ -n "$SLACK_BOT_TOKEN" ] || { echo "::error::SLACK_BOT_TOKEN is not configured"; exit 1; }
          if [ -n "$TARGET_GO" ] && ! [[ "$TARGET_GO" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::target_go_version must look like 1.27.4"
            exit 1
          fi

  prepare:
    name: Prepare
    needs: validate-configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base_branch: ${{ steps.base.outputs.branch }}
      base_sha: ${{ steps.base.outputs.sha }}
    steps:
      - name: Resolve base commit
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq .object.sha)
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve branch ${branch}"
            exit 1
          fi
          echo "Upgrading ${branch} at ${sha}"
          {
            echo "branch=${branch}"
            echo "sha=${sha}"
          } >> "$GITHUB_OUTPUT"

  go-update:
    name: Go · resolve upgrades
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      has_changes: ${{ steps.package.outputs.has_changes }}
      target_go: ${{ steps.resolve.outputs.version }}
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout base commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false

      - name: Resolve Go version
        id: resolve
        env:
          TARGET_GO_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.target_go_version || '' }}
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import json
          import os
          import pathlib
          import re
          import sys
          import time
          import urllib.request


          def parse(value):
              numbers = [int(part) for part in value.split(".")]
              while len(numbers) < 3:
                  numbers.append(0)
              return tuple(numbers[:3])


          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)


          text = pathlib.Path("go.mod").read_text(encoding="utf-8")
          current = re.findall(r"(?m)^go\s+(\d+\.\d+(?:\.\d+)?)\s*$", text)
          current += re.findall(r"(?m)^toolchain\s+go(\d+\.\d+(?:\.\d+)?)\s*$", text)
          highest = max(current, key=parse) if current else ""

          target = os.environ["TARGET_GO_INPUT"].strip()
          if not target:
              request = urllib.request.Request(
                  "https://go.dev/dl/?mode=json",
                  headers={"User-Agent": "wpd-gogate-upgrade-dependencies"},
              )
              releases = None
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          releases = json.load(response)
                      break
                  except Exception as error:
                      print(f"go.dev request failed: {error}")
                      time.sleep(5 * (attempt + 1))
              if not releases:
                  fail("Could not read the latest Go release from go.dev")
              stable = [release["version"] for release in releases if release.get("stable")]
              if not stable:
                  fail("go.dev returned no stable release")
              target = stable[0].removeprefix("go")

          if not re.fullmatch(r"\d+\.\d+(\.\d+)?", target):
              fail(f"Invalid Go version: {target}")
          if highest and parse(target) < parse(highest):
              fail(f"Target Go {target} is older than {highest} in go.mod. Refusing to downgrade.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={target}\n")
          print(f"Selected Go {target}")
          PY

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.resolve.outputs.version }}
          check-latest: false
          cache: false

      - name: Upgrade Go modules
        env:
          TARGET_GO: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/go-upgrade"
          mkdir -p "$work/out"
          old_go=$(awk '$1 == "go" { print $2; exit }' go.mod)
          go list -m -json all > "$work/before.json" || rm -f "$work/before.json"

          go get "go@${TARGET_GO}"
          go get "toolchain@go${TARGET_GO}"
          go get -u -t ./...
          go mod tidy

          new_go=$(awk '$1 == "go" { print $2; exit }' go.mod)
          go list -m -json all > "$work/after.json" || rm -f "$work/after.json"
          printf '%s\t%s\n' "$old_go" "$new_go" > "$work/go-versions.txt"

      - name: Describe Go changes
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import json
          import os
          import pathlib

          work = pathlib.Path(os.environ["RUNNER_TEMP"]) / "go-upgrade"


          def load_modules(path):
              if not path.is_file() or path.stat().st_size == 0:
                  return {}
              data = path.read_text(encoding="utf-8")
              decoder = json.JSONDecoder()
              index = 0
              modules = {}
              while index < len(data):
                  while index < len(data) and data[index].isspace():
                      index += 1
                  if index >= len(data):
                      break
                  obj, index = decoder.raw_decode(data, index)
                  if obj.get("Path") and not obj.get("Main"):
                      modules[obj["Path"]] = (obj.get("Version", ""), bool(obj.get("Indirect", False)))
              return modules


          old_go, new_go = (work / "go-versions.txt").read_text(encoding="utf-8").strip().split("\t")
          before = load_modules(work / "before.json")
          after = load_modules(work / "after.json")

          go_lines = []
          if old_go != new_go:
              go_lines.append(f"| `.` | `{old_go}` | `{new_go}` |")

          direct_lines = []
          indirect_count = 0
          for path in sorted(set(before) | set(after)):
              old_version, old_indirect = before.get(path, ("", False))
              new_version, new_indirect = after.get(path, ("", old_indirect))
              if old_version == new_version:
                  continue
              if new_indirect:
                  indirect_count += 1
                  continue
              if not old_version:
                  change = f"added `{new_version}`"
              elif not new_version:
                  change = f"removed `{old_version}`"
              else:
                  change = f"`{old_version}` → `{new_version}`"
              direct_lines.append(f"| `{path}` | {change} |")

          parts = [
              "### Automated Go dependency upgrade",
              "",
              "This pull request was opened only after the upgrade passed CI-equivalent checks",
              "(gofmt, latest golangci-lint, `go build`, and `go test -race`) in an isolated job.",
              "",
          ]
          if go_lines:
              parts += ["| Module | Previous Go | New Go |", "|---|---|---|", *go_lines, ""]
          if direct_lines:
              parts += ["| Direct dependency | Change |", "|---|---|", *direct_lines[:60], ""]
              if len(direct_lines) > 60:
                  parts += [f"{len(direct_lines) - 60} more direct dependencies changed.", ""]
          if indirect_count:
              parts += [f"{indirect_count} indirect modules changed.", ""]
          parts += [f"Workflow run: {os.environ['RUN_URL']}", ""]
          (work / "out" / "body.md").write_text("\n".join(parts), encoding="utf-8")
          PY

      - name: Package patch
        id: package
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/go-upgrade"
          git add -- go.mod go.sum
          if git diff --cached --quiet; then
            echo "Go modules and the Go version are already up to date."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --stat
          git diff --cached --binary > "$work/out/changes.patch"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Upload patch
        if: steps.package.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: go-upgrade
          path: ${{ runner.temp }}/go-upgrade/out/
          if-no-files-found: error
          retention-days: 1

  go-test:
    name: Go · test upgrade
    needs: [prepare, go-update]
    if: needs.go-update.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # No secrets: upgraded module code must not see tokens.
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_gogate
        ports:
          - 54322:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout base commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false

      - name: Download patch
        uses: actions/download-artifact@v4
        with:
          name: go-upgrade
          path: ${{ runner.temp }}/go-upgrade

      - name: Apply patch
        run: git apply --binary "$RUNNER_TEMP/go-upgrade/changes.patch"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.go-update.outputs.target_go }}
          check-latest: false
          cache: false

      - name: Check formatting
        run: |
          set -euo pipefail
          UNFORMATTED=$(gofmt -l . | grep -v vendor || true)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::Code not formatted after the upgrade. Run 'gofmt -w .' and retry."
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Install and run latest golangci-lint
        run: |
          set -euo pipefail
          LINT_VERSION=$(curl -fsSL https://api.github.com/repos/golangci/golangci-lint/releases/latest | jq -r .tag_name)
          if ! [[ "$LINT_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not resolve latest golangci-lint release (got '${LINT_VERSION}')"
            exit 1
          fi
          echo "Installing golangci-lint ${LINT_VERSION}"
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${LINT_VERSION}"
          golangci-lint version
          golangci-lint run --timeout=5m ./...

      - name: Test Go modules
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 54322
          TEST_DB_USER: test_user
          TEST_DB_PASSWORD: test_password
          TEST_DB_NAME: test_gogate
        run: |
          set -euo pipefail
          go build ./...
          go test -race ./...

  go-pr:
    name: Go · open pull request
    needs: [prepare, go-update, go-test]
    if: needs.go-test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      url: ${{ steps.cpr.outputs.pull-request-url }}
      operation: ${{ steps.cpr.outputs.pull-request-operation }}
      summary: ${{ steps.describe.outputs.summary }}
      detail: ${{ steps.ci-align.outputs.detail || steps.describe.outputs.summary }}
    steps:
      - name: Checkout base commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          # GITHUB_TOKEN: this job already has contents:write + pull-requests:write.
          # Do not mint an App installation token here — installation 100483798 is
          # not granted those writes, so permission-* requests 422.
          token: ${{ github.token }}

      - name: Download patch
        uses: actions/download-artifact@v4
        with:
          name: go-upgrade
          path: ${{ runner.temp }}/go-upgrade

      - name: Apply and check patch
        run: |
          set -euo pipefail
          git apply --index --binary "$RUNNER_TEMP/go-upgrade/changes.patch"
          python3 - << 'PY'
          import subprocess
          import sys

          allowed = {"go.mod", "go.sum"}
          raw = subprocess.run(
              ["git", "diff", "--cached", "--name-only", "-z", "--no-renames"],
              check=True,
              capture_output=True,
          ).stdout
          paths = [path for path in raw.decode("utf-8", "surrogateescape").split("\0") if path]
          problems = []
          if not paths:
              problems.append("the patch is empty")
          for path in paths:
              if path not in allowed:
                  problems.append(f"{path}: not a dependency file")
          for problem in problems:
              print(f"::error::Rejected upgrade patch: {problem}")
          if problems:
              sys.exit(1)
          print(f"Patch touches {len(paths)} dependency files.")
          PY

      - name: Align related Go version references
        id: ci-align
        env:
          TARGET_GO: ${{ needs.go-update.outputs.target_go }}
          BASE_BRANCH: ${{ needs.prepare.outputs.base_branch }}
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import os
          import pathlib
          import re
          import subprocess
          import sys

          target = os.environ["TARGET_GO"]
          base = os.environ["BASE_BRANCH"]
          work = pathlib.Path(os.environ["RUNNER_TEMP"])
          notes = []
          blocked = []

          # Prefer CI that tracks go.mod. Hardcoded GO_VERSION cannot be fixed by
          # GITHUB_TOKEN (cannot push workflow files), so block the PR instead.
          ci_path = pathlib.Path(".github/workflows/ci.yml")
          if ci_path.is_file():
              text = ci_path.read_text(encoding="utf-8")
              uses_mod = "go-version-file:" in text and "go.mod" in text
              pin = re.search(r'(?m)^  GO_VERSION:\s*"(\d+\.\d+(?:\.\d+)?)"\s*$', text)
              pinned_go_version = re.search(
                  r'(?m)^\s+go-version:\s*\$\{\{\s*env\.GO_VERSION\s*\}\}\s*$', text
              )
              hardcoded = re.findall(
                  r'(?m)^\s+go-version:\s*["\']?(\d+\.\d+(?:\.\d+)?)["\']?\s*$', text
              )
              if uses_mod and not pin and not hardcoded:
                  notes.append("- `.github/workflows/ci.yml` already tracks `go.mod`")
              else:
                  current = pin.group(1) if pin else (hardcoded[0] if hardcoded else "unknown")
                  blocked.append(
                      (
                          f"CI still uses a hardcoded Go pin (`{current}`) instead of "
                          f"`go-version-file: go.mod`. GITHUB_TOKEN cannot update workflow "
                          f"files, so this upgrade PR was not opened.\n\n"
                          f"Fix on `{base}` then re-run *Upgrade dependencies*:\n"
                          f"```bash\n"
                          f"git checkout {base} && git pull\n"
                          f"# In .github/workflows/ci.yml remove GO_VERSION and use:\n"
                          f"#   go-version-file: go.mod\n"
                          f"# Keep installing latest golangci-lint from GitHub releases.\n"
                          f"git add .github/workflows/ci.yml\n"
                          f"git commit -m 'ci: track Go version from go.mod'\n"
                          f"git push origin {base}\n"
                          f"```"
                      )
                  )

          # Non-workflow pins can be updated in the PR.
          skip_dirs = {".git", "vendor", "node_modules", ".history"}
          patterns = [
              re.compile(r"(?P<pre>\bGO_VERSION:\s*[\"']?)(?P<ver>\d+\.\d+(?:\.\d+)?)(?P<post>[\"']?)"),
              re.compile(r"(?P<pre>\bgo-version:\s*[\"']?)(?P<ver>\d+\.\d+(?:\.\d+)?)(?P<post>[\"']?)"),
              re.compile(r"(?P<pre>\bGOTOOLCHAIN:\s*[\"']?go)(?P<ver>\d+\.\d+(?:\.\d+)?)(?P<post>[\"']?)"),
              re.compile(r"(?P<pre>\bGO_VERSION=)(?P<ver>\d+\.\d+(?:\.\d+)?)(?P<post>)"),
              re.compile(r"(?P<pre>\bgolang:)(?P<ver>\d+\.\d+(?:\.\d+)?)(?P<post>)"),
          ]
          tool_versions = re.compile(r"(?m)^(?P<pre>golang\s+)(?P<ver>\d+\.\d+(?:\.\d+)?)(?P<post>.*)$")

          def parse(value):
              parts = [int(p) for p in value.split(".")]
              while len(parts) < 3:
                  parts.append(0)
              return tuple(parts[:3])

          target_t = parse(target)
          candidates = []
          for dirpath, dirnames, filenames in os.walk("."):
              dirnames[:] = [n for n in dirnames if n not in skip_dirs]
              for name in filenames:
                  if name in {".go-version", ".tool-versions"} or name.startswith(
                      ("Dockerfile", "docker-compose", "compose.")
                  ) or name.endswith(".Dockerfile"):
                      candidates.append(pathlib.Path(dirpath) / name)

          for path in candidates:
              if path.is_symlink() or not path.is_file():
                  continue
              rel = path.as_posix().removeprefix("./")
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              changes = []

              def replacer(match, _changes=changes, _rel=rel):
                  current = match.group("ver")
                  if parse(current) >= target_t:
                      return match.group(0)
                  _changes.append(f"- `{_rel}`: `{current}` → `{target}`")
                  return f"{match.group('pre')}{target}{match.group('post') or ''}"

              if path.name == ".go-version":
                  current = text.strip()
                  if re.fullmatch(r"\d+\.\d+(\.\d+)?", current) and parse(current) < target_t:
                      updated = target + ("\n" if text.endswith("\n") else "")
                      changes.append(f"- `{rel}`: `{current}` → `{target}`")
                  else:
                      updated = text
              elif path.name == ".tool-versions":
                  updated = tool_versions.sub(replacer, text)
              else:
                  updated = text
                  for pattern in patterns:
                      updated = pattern.sub(replacer, updated)

              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  notes.extend(changes)
                  subprocess.run(["git", "add", "--", rel], check=True)

          (work / "go-pins.md").write_text("\n".join(dict.fromkeys(notes)), encoding="utf-8")
          detail_path = work / "go-pr-detail.md"
          if blocked:
              detail = blocked[0]
              detail_path.write_text(detail, encoding="utf-8")
              print(f"::error::{detail.splitlines()[0]}")
              print(detail)
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write(f"detail<<EOF_DETAIL\n{detail[:2500]}\nEOF_DETAIL\n")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("## Upgrade blocked: CI is not tracking go.mod\n\n")
                  summary.write(detail + "\n")
              raise SystemExit(1)

          detail_path.write_text("", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("detail=\n")
          print("\n".join(notes) or "No related Go version pins changed.")
          PY

      - name: Describe pull request
        id: describe
        env:
          TARGET_GO: ${{ needs.go-update.outputs.target_go }}
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import os
          import pathlib
          import re
          import subprocess

          work = pathlib.Path(os.environ["RUNNER_TEMP"])
          target = os.environ["TARGET_GO"]
          directive = re.compile(r"(?m)^go\s+(\S+)\s*$")
          version_lines = re.compile(r"(?m)^(go|toolchain)\s+\S+\s*$")

          before = subprocess.run(
              ["git", "show", "HEAD:go.mod"], capture_output=True, text=True, check=True
          ).stdout
          after = pathlib.Path("go.mod").read_text(encoding="utf-8")
          old = directive.search(before)
          go_changed = [m.group(0) for m in version_lines.finditer(before)] != [
              m.group(0) for m in version_lines.finditer(after)
          ]
          deps_changed = version_lines.sub("", before) != version_lines.sub("", after)
          changed = subprocess.run(
              ["git", "diff", "HEAD", "--name-only"], capture_output=True, text=True, check=True
          ).stdout.split()
          if any(path.endswith("go.sum") for path in changed):
              deps_changed = True
          pins = (work / "go-pins.md").read_text(encoding="utf-8").strip()
          go_changed = go_changed or bool(pins)

          if old and old.group(1) != target:
              version_summary = f"Go `{old.group(1)}` → `{target}`"
          else:
              version_summary = f"Go `{target}`"
          if go_changed and deps_changed:
              title = f"chore(deps): upgrade Go to {target} and module dependencies"
              summary = f"{version_summary} and module dependencies"
          elif go_changed:
              title = f"chore(deps): upgrade Go to {target}"
              summary = version_summary
          else:
              title = "chore(deps): upgrade Go module dependencies"
              summary = "Go module dependencies"

          body = (work / "go-upgrade" / "body.md").read_text(encoding="utf-8")[:50000]
          if pins:
              body += f"\n#### Related Go version pins\n\n{pins}\n"
          body += (
              "\nCI tracks `go.mod` via `go-version-file` and installs the latest "
              "stable golangci-lint, so no separate workflow Go pin bump is required.\n"
          )
          body += (
              "\n> CI may not start automatically on this PR (opened with "
              "`GITHUB_TOKEN`). Re-run workflows or push an empty commit if checks are required.\n"
          )
          body += "\n_Opened by the Upgrade Dependencies workflow._\n"
          (work / "go-pr-body.md").write_text(body, encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"title={title}\nsummary={summary}\n")
          print(title)
          PY

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ github.token }}
          base: ${{ needs.prepare.outputs.base_branch }}
          branch: chore/upgrade-go-dependencies
          delete-branch: true
          commit-message: ${{ steps.describe.outputs.title }}
          committer: ${{ env.BOT_IDENTITY }}
          author: ${{ env.BOT_IDENTITY }}
          title: ${{ steps.describe.outputs.title }}
          body-path: ${{ runner.temp }}/go-pr-body.md
          labels: |
            automated-pr
            dependencies

      - name: Write summary
        env:
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          PR_OPERATION: ${{ steps.cpr.outputs.pull-request-operation }}
        run: |
          {
            echo "## Go dependency upgrade"
            echo ""
            echo "Pull request ${PR_OPERATION:-unchanged}: ${PR_URL:-none}"
          } >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: Notify Slack
    needs: [go-update, go-test, go-pr]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Compose and send Slack message
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CHANNEL: ${{ vars.SLACK_ALERTS_CHANNEL_ID }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          UPDATE_RESULT: ${{ needs.go-update.result }}
          HAS_CHANGES: ${{ needs.go-update.outputs.has_changes }}
          TEST_RESULT: ${{ needs.go-test.result }}
          PR_RESULT: ${{ needs.go-pr.result }}
          PR_URL: ${{ needs.go-pr.outputs.url }}
          PR_OPERATION: ${{ needs.go-pr.outputs.operation }}
          SUMMARY: ${{ needs.go-pr.outputs.summary }}
          DETAIL: ${{ needs.go-pr.outputs.detail }}
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          env = os.environ
          run_link = f"<{env['RUN_URL']}|View workflow run>"


          def escape(text):
              return text.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")


          successes = []
          failures = []
          detail = (env.get("DETAIL") or "").strip()
          if env["UPDATE_RESULT"] != "success":
              failures.append(
                  f"*Go*: resolving upgrades failed before tests ran. {run_link}"
              )
          elif env.get("HAS_CHANGES") != "true":
              pass
          elif env["TEST_RESULT"] != "success":
              failures.append(
                  "*Go*: upgrade failed CI-equivalent checks "
                  "(gofmt / latest golangci-lint / build / race tests), "
                  f"so no pull request was opened. {run_link}"
              )
          elif env["PR_RESULT"] != "success":
              if detail:
                  failures.append(
                      "*Go*: checks passed, but the PR was blocked because related "
                      f"CI/config still needs a manual fix.\n{escape(detail)}\n{run_link}"
                  )
              else:
                  failures.append(
                      "*Go*: checks passed, but the pull request could not be created. "
                      f"{run_link}"
                  )
          elif env["PR_OPERATION"] in ("created", "updated") and env["PR_URL"].startswith(
              f"{env['SERVER_URL']}/{env['REPOSITORY']}/pull/"
          ):
              verb = "opened" if env["PR_OPERATION"] == "created" else "updated"
              summary = escape(env["SUMMARY"] or "Go dependencies")
              successes.append(
                  f"*Go*: pull request {verb}. {summary}\n<{env['PR_URL']}|Open pull request>"
              )

          lines = failures + successes
          if not lines:
              print("Nothing to report.")
              raise SystemExit(0)

          failed = bool(failures)
          heading = "Go dependency upgrade failed" if failed else "Go dependency upgrade"
          message = f"*{heading}* in `{env['REPOSITORY']}`\n\n" + "\n\n".join(lines)
          print(message[:2900])

          payload = {
              "channel": env["CHANNEL"],
              "text": message[:2900],
              "unfurl_links": False,
              "unfurl_media": False,
          }
          request = urllib.request.Request(
              "https://slack.com/api/chat.postMessage",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {env['SLACK_BOT_TOKEN']}",
                  "Content-Type": "application/json; charset=utf-8",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = json.load(response)
          except urllib.error.HTTPError as error:
              print(f"::error::Slack HTTP {error.code}: {error.read()[:500]!r}")
              raise SystemExit(1) from error
          if not body.get("ok"):
              print(f"::error::Slack API error: {body.get('error', 'unknown')}")
              raise SystemExit(1)
          print("Slack notification sent.")
          PY
