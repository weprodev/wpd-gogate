name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Track go.mod so dependency upgrades cannot leave CI on an older toolchain.
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l . | grep -v vendor || true)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::Code not formatted. Run 'gofmt -w .'"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Install and run golangci-lint
        run: |
          set -euo pipefail
          # Always use the latest stable release so export-data support tracks Go.
          LINT_VERSION=$(curl -fsSL https://api.github.com/repos/golangci/golangci-lint/releases/latest | jq -r .tag_name)
          if ! [[ "$LINT_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not resolve latest golangci-lint release (got '${LINT_VERSION}')"
            exit 1
          fi
          echo "Installing golangci-lint ${LINT_VERSION}"
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${LINT_VERSION}"
          golangci-lint version
          golangci-lint run --timeout=5m ./...

  test-unit:
    name: 🧪 Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: |
          go test -race -v -coverprofile=coverage.out -covermode=atomic ./...

  test-integration:
    name: 🛢️ Integration Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_gogate
        ports:
          - 54322:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run E2E Integration tests
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 54322
          TEST_DB_USER: test_user
          TEST_DB_PASSWORD: test_password
          TEST_DB_NAME: test_gogate
        run: |
          go test -race -v ./...
